[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cos480-cbd"
version = "0.1.0"
description = "Preparação reproduzível dos dados e consultas da bancada COS480"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
plots = ["matplotlib>=3.8"]  # só bench/plots.py (AGENTS §2)

[tool.setuptools.packages.find]
include = ["bench*", "cbd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
